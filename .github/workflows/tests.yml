name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast, toolchain-free checks: manifests, version discipline, hook unit
  # tests, and skill reference integrity.
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests
        run: |
          jq -e . .claude-plugin/plugin.json > /dev/null
          jq -e . .claude-plugin/marketplace.json > /dev/null
          jq -e . hooks/hooks.json > /dev/null
      - name: Version discipline (plugin.json == README == CHANGELOG)
        run: |
          v=$(jq -r .version .claude-plugin/plugin.json)
          grep -q -- "- Version: $v" README.md
          grep -q "## \[$v\]" CHANGELOG.md
      - name: Hook unit tests
        run: |
          for t in hooks/test/*.sh; do
            echo "== $t"
            bash "$t"
          done
      - name: Token-hygiene tests
        run: bash tools/token-hygiene/test/hygiene_test.sh
      - name: Skill reference integrity
        run: python3 scripts/verify_references.py
